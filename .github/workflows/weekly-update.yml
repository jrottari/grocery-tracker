name: Weekly Grocery Update

on:
  schedule:
    # GitHub Actions scheduled triggers are best-effort and are frequently
    # delayed by several hours (observed: ~4-5h late on this repo). A single
    # 9am-only trigger with an exact-hour gate meant every scheduled run
    # silently skipped since the delayed firing never actually landed at
    # 09:00 America/New_York. Instead, fire every 3 hours all day Wednesday
    # (UTC) and de-dupe on the commit message so whichever firing actually
    # lands still does exactly one real update.
    - cron: "0 */3 * * 3"
  workflow_dispatch: {}   # allows manual "Run workflow" from the Actions tab

permissions:
  contents: write

jobs:
  check-time:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          today=$(date -u +%Y-%m-%d)
          if git log -1 --format=%s | grep -q "Weekly grocery update $today"; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: already ran today ($today) — this is a later re-fire of the same day's schedule."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  update:
    needs: check-time
    if: needs.check-time.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run weekly update
        env:
          BLS_API_KEY: ${{ secrets.BLS_API_KEY }}
          FDC_API_KEY: ${{ secrets.FDC_API_KEY }}
          POSTAL_CODE: ${{ secrets.POSTAL_CODE }}
          DB_PATH: data/grocery_tracker.db
          EXPORT_DIR: exports
        run: |
          python main.py update
          python main.py categorize
          python main.py export csv
          python main.py history_append

      - name: Commit and push updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/grocery_tracker.db exports/
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Weekly grocery update $(date -u +%Y-%m-%d)"
            git push
          fi
